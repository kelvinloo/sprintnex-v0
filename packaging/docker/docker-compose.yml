services:
  openwork-host:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep this in sync with apps/orchestrator/package.json if you want a pinned release.
        SPRINTNEX_ORCHESTRATOR_VERSION: 0.11.22
    ports:
      - "8787:8787"
    environment:
      # Set these explicitly for stable sharing.
      # SPRINTNEX_TOKEN: "..."
      # SPRINTNEX_HOST_TOKEN: "..."
      # Optional: SPRINTNEX_APPROVAL_MODE: "auto"
      # Optional: SPRINTNEX_APPROVAL_TIMEOUT_MS: "30000"
      SPRINTNEX_DATA_DIR: /data/sprintnex-orchestrator
      SPRINTNEX_SIDECAR_DIR: /data/sidecars
    volumes:
      # Mount an existing project/workspace here.
      - ./workspace:/workspace
      # Persistent host data (OpenCode caches, server config, tokens).
      - ./data:/data
